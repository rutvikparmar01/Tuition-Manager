<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="glyph" x1="190" y1="128" x2="290" y2="292" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="badge" x1="314" y1="300" x2="462" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="40" y="40" width="420" height="460" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
    <filter id="badgeShadow" x="270" y="260" width="240" height="240" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#064E3B" flood-opacity="0.35"/>
    </filter>
    <clipPath id="frame"><rect width="512" height="512"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Background -->
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="460" cy="40" r="210" fill="#FFFFFF" fill-opacity="0.10"/>
    <circle cx="10" cy="480" r="180" fill="#1E1B4B" fill-opacity="0.25"/>

    <!-- Stacked page behind -->
    <rect x="134" y="96" width="268" height="310" rx="44" fill="#C7D2FE" fill-opacity="0.55" transform="rotate(-8 268 251)"/>

    <!-- Ledger card -->
    <g filter="url(#cardShadow)">
      <rect x="110" y="92" width="268" height="318" rx="44" fill="#FFFFFF"/>
    </g>

    <!-- Rupee glyph -->
    <g stroke="url(#glyph)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
      <path d="M188 136 H300"/>
      <path d="M188 180 H300"/>
      <path d="M200 136 H226 C264 136 280 156 280 180 C280 206 258 224 226 224 H202"/>
      <path d="M210 224 L282 300"/>
    </g>

    <!-- Attendance dots -->
    <rect x="155" y="336" width="34" height="34" rx="11" fill="#22C55E"/>
    <rect x="203" y="336" width="34" height="34" rx="11" fill="#22C55E"/>
    <rect x="251" y="336" width="34" height="34" rx="11" fill="#EF4444"/>
    <rect x="299" y="336" width="34" height="34" rx="11" fill="#22C55E"/>

    <!-- Check badge -->
    <g filter="url(#badgeShadow)">
      <circle cx="388" cy="374" r="80" fill="#FFFFFF"/>
      <circle cx="388" cy="374" r="68" fill="url(#badge)"/>
    </g>
    <path d="M356 376 L380 400 L422 352" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
